# The dsh-commandcode bundle layer: one provider row, no inlined secrets.
#
# The API key resolves per request: the credentials service value for
# `apiKeyEnv` (default COMMANDCODE_API_KEY), then that variable in the launch
# environment, then the command-code CLI's own sign-in at
# ~/.commandcode/auth.json. Agent rows keep their own provider/model choice;
# select `commandcode` from the model picker.
- insert:
    - id: llm-commandcode
      name: 'dsh-commandcode'
